name: Backup monitor
# 独立备份监控（站长 2026-10-27 方案 C：PITR + 独立加密 dump；本工作流盯「独立加密 dump」）。
# 与 DB backup 工作流互不依赖：按自己的时间表检查「最新一次成功备份的未过期加密产物」是否存在、是否超过阈值，
# 超过 / 缺失就打开（或更新）一个 backup-alert 标签的 issue，并让本次运行失败；恢复后自动留言并关闭 issue。
# 逻辑在 scripts/ops/backup-monitor.mjs（tests/unit/backup-monitor.test.ts 用夹具测过）。不读取任何备份 Secret / 内容。
# 阈值：仓库变量 BACKUP_MAX_AGE_HOURS（Settings → Secrets and variables → Actions → Variables），默认 192 小时
#   = 每周一次 + 1 天余量；站长批准更高频率后改为「频率 + 余量」（例如每日 → 26）。
# 注意：定时与手动触发只对默认分支（main）上的工作流生效——经运维 PR 合并到 main 后才会开始运行（需站长批准）。
on:
  schedule:
    - cron: '45 */6 * * *' # 每 6 小时（UTC xx:45），与备份时间错开
  workflow_dispatch:
    inputs:
      max_age_hours:
        description: '告警阈值（小时），留空用仓库变量 BACKUP_MAX_AGE_HOURS 或默认 192'
        required: false
        default: ''

permissions:
  contents: read
  actions: read
  issues: write

defaults:
  run:
    shell: bash

concurrency:
  group: backup-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: 检查最新独立加密备份
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MAX_AGE_HOURS: ${{ inputs.max_age_hours || vars.BACKUP_MAX_AGE_HOURS || '192' }}
          BACKUP_WORKFLOW: db-backup.yml
          ALERT_LABEL: backup-alert
        run: node scripts/ops/backup-monitor.mjs
