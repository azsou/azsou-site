name: CI
# 每个 PR 与非 main 分支推送：lint → 类型检查 → 单元 → 构建 → 死链 / HTML / 结构化数据 / 体积 / CSP 哈希 → E2E（3 引擎 × 4 视口 + axe；
# 社区流程、角色矩阵、图片上传连真实 Postgres + PostgREST；每个引擎分 2 片并行）→ Lighthouse（移动端，四项 ≥ 95）
# 另有 db：Postgres 17 服务容器上跑迁移 + RLS 角色矩阵 + Storage RLS + PostgREST 14 重放 V72 请求 + 备份恢复演练
on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_dispatch:
    inputs:
      update_visual:
        description: '重新生成视觉回归基线（产物 visual-baseline-*，审阅后提交）'
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # 加载 src/content/apps/_e2e/ 的测试夹具应用（下载中转 / 平台识别 E2E 用）；Vercel 的构建不设，线上没有夹具
      AZ_E2E_FIXTURES: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm run check:assets
      - run: npm run check
      - run: npm run test:unit
      - run: npm run build
      - run: npm run test:links
      - run: npm run test:html
      - run: npm run test:ld
      - run: npm run size
      - run: npm run test:csp
      - uses: actions/upload-artifact@v4
        with: { name: dist, path: dist, retention-days: 3 }
      # P8：广告开启变体（假客户端 ID ca-pub-0000000000000000）——产物检查（ads.txt / 广告位 / CSP 副本），
      # 再交给 e2e 的 tests/e2e/ads.spec.ts 在三个浏览器里实测尺寸、与按钮的距离和 Consent Mode 顺序。线上构建不会用到。
      - run: npm run build:ads
      - run: npm run test:ads
      - uses: actions/upload-artifact@v4
        with:
          name: dist-ads
          path: |
            dist-ads/client
            dist-ads.vercel.json
          retention-days: 3

  db:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      POSTGREST_BIN: ${{ github.workspace }}/.bin/postgrest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: PostgREST 14（与生产同一大版本）
        run: |
          mkdir -p .bin
          curl -fsSL https://github.com/PostgREST/postgrest/releases/download/v14.18/postgrest-v14.18-linux-static-x86-64.tar.xz | tar -xJ -C .bin
          .bin/postgrest --version
      - run: npm run test:db
      - name: PostgreSQL 17 客户端（恢复演练用 pg_dump / pg_restore）
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -qq postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
      - name: 备份恢复演练（dump → 整库恢复 / 换库恢复 → 核对 → RLS 测试）
        run: bash scripts/restore-drill.sh
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with: { name: rls-matrix, path: test-results/rls-matrix.md, retention-days: 14 }

  e2e:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
        shard: [1, 2]
    # 社区（P3）用例的真实后端：Postgres 17 跑全部迁移 + PostgREST 14，浏览器的 /rest/v1 请求转发过去
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      POSTGREST_BIN: ${{ github.workspace }}/.bin/postgrest
      E2E_REQUIRE_DB: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - uses: actions/download-artifact@v4
        with: { name: dist, path: dist }
      - uses: actions/download-artifact@v4
        with: { name: dist-ads, path: . }
      - name: PostgREST 14
        run: |
          mkdir -p .bin
          curl -fsSL https://github.com/PostgREST/postgrest/releases/download/v14.18/postgrest-v14.18-linux-static-x86-64.tar.xz | tar -xJ -C .bin
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npx playwright test --shard=${{ matrix.shard }}/2
        env:
          PW_BROWSERS: ${{ matrix.browser }}
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.browser }}-${{ matrix.shard }}
          path: playwright-report
          retention-days: 7

  # P9 设计门禁（T9.2）：Q5 / Q8 / Q11 / Q12 / Q18 断言 + Q2 视觉回归（Chromium + Noto CJK，2 片并行）。
  # 没有基线（首次）或手动触发 update_visual 时写出基线并上传为产物，审阅后提交到 tests/visual/__screenshots__/。
  design:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - uses: actions/download-artifact@v4
        with: { name: dist, path: dist }
      - name: Chromium + 中文字体
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
          npx playwright install --with-deps chromium
      - name: 设计门禁 + 视觉回归
        run: |
          UPDATE=""
          if [ "${{ inputs.update_visual }}" = "true" ] || [ -z "$(ls tests/visual/__screenshots__ 2>/dev/null)" ]; then UPDATE="--update-snapshots=all"; fi
          npx playwright test -c playwright.design.config.ts --shard=${{ matrix.shard }}/2 $UPDATE
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: visual-baseline-${{ matrix.shard }}
          path: tests/visual/__screenshots__
          retention-days: 7
          if-no-files-found: ignore
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: design-report-${{ matrix.shard }}
          path: playwright-report-design
          retention-days: 7
          if-no-files-found: ignore

  lighthouse:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - uses: actions/download-artifact@v4
        with: { name: dist, path: dist }
      - run: npx --yes @lhci/cli@0.15.x autorun --config=lighthouserc.cjs
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with: { name: lighthouse, path: .lighthouseci, retention-days: 7, include-hidden-files: true }
