name: Supabase keepalive
# Free Supabase projects pause after a week without activity; ping every 3 days.
on:
  schedule:
    - cron: '17 3 */3 * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Read one public row
        env:
          SB_URL: https://abryflgoljltyakthtql.supabase.co
          SB_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_whTlV4b20Da6ShYOdYjs0Q_-d6RTSRh' }}
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" "$SB_URL/rest/v1/forum_threads?select=id&limit=1" -H "apikey: $SB_KEY" -H "Authorization: Bearer $SB_KEY")
          echo "HTTP $code"; test "$code" = "200"
